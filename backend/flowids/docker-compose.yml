services:
  # 1. Spring Boot App
  app:
    build: .
    container_name: netsentry-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev_flowids_db
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MODEL_SERVER_URL: ${MODEL_SERVER_URL}
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  # 2. PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: netsentry-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dev_flowids_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Redis
  redis:
    image: redis:alpine
    container_name: netsentry-redis
    ports:
      - "6379:6379"

