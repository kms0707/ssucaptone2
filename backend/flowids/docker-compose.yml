services:
  # 1. PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: netsentry-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dev_flowids_db
      POSTGRES_USER: myuser      # IntelliJ 환경변수와 일치시킬 것
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis
  redis:
    image: redis:alpine
    container_name: netsentry-redis
    ports:
      - "6379:6379"

  # 3. Zookeeper (Confluent 공식 이미지로 교체)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: netsentry-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 4. Kafka (Confluent 공식 이미지로 교체)
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: netsentry-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 5. Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: netsentry-elastic
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  # 6. Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: netsentry-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  postgres_data: